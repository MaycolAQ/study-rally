<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Rally - Perú Global</title>
<style>
body{background:#0f172a;color:white;font-family:system-ui;text-align:center;margin:0;padding:10px}
#box{background:white;color:#0f172a;border-radius:18px;padding:22px;max-width:600px;margin:15px auto;min-height:320px}
button{padding:13px;margin:6px;border-radius:12px;border:1px solid #e2e8f0;background:white;width:100%;text-align:left;cursor:pointer}
button.correct{background:#22c55e!important;color:white} button.wrong{background:#ef4444!important;color:white}
select{background:#1e293b;color:white;border-radius:8px;padding:8px;border:1px solid #334155}
.bar{height:8px;background:#1e293b;border-radius:10px;max-width:600px;margin:10px auto} #fill{height:8px;background:#22c55e;width:0%;border-radius:10px;transition:.3s}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;max-width:600px;margin:auto;align-items:center">
<h2 style="margin:0">🏁 Study Rally</h2>
<select id="idioma" onchange="cambiarIdioma()">
<option value="es">🇵🇪 Español</option>
<option value="en">🇺🇸 English</option>
<option value="pt">🇧🇷 Português</option>
<option value="fr">🇫🇷 Français</option>
</select>
</div>
<div id="estado" style="color:#94a3b8;font-size:12px">🌐 Anti-plagio + Traducción IA completa</div>
<div class="bar"><div id="fill"></div></div>
<div id="box">Cargando...</div>
<script>
let LANG="es", idx=0, pts=0, falladas=[], fase="reto", cola=[];
let T={ es:{preg:"Pregunta",puntaje:"Tu puntaje",ok:"¡Aprobaste!",no:"A practicar",ia:"🧠 Aprendizaje con IA",cont:"Continuar",trad:"Traducido por IA"}, en:{preg:"Question",puntaje:"Your Score",ok:"Passed!",no:"Keep practicing",ia:"🧠 AI Learning",cont:"Continue",trad:"Translated by AI"}, pt:{preg:"Pergunta",puntaje:"Sua nota",ok:"Aprovado!",no:"Pratique",ia:"🧠 Aprendizado IA",cont:"Continuar",trad:"Traduzido por IA"}, fr:{preg:"Question",puntaje:"Score",ok:"Réussi!",no:"Pratiquez",ia:"🧠 Apprentissage IA",cont:"Continuer",trad:"Traduit par IA"} };
async function traducirIA(texto, lang){ if(lang==="es") return texto; const d={"Sinónimo de ACLARAR":{en:"Synonym of CLARIFY",pt:"Sinônimo de ESCLARECER",fr:"Synonyme de CLARIFIER"},"Explicar":{en:"Explain",pt:"Explicar",fr:"Expliquer"},"Confundir":{en:"Confuse",pt:"Confundir",fr:"Confondre"},"Colegio":{en:"School",pt:"Escola",fr:"École"},"por eso":{en:"that's why",pt:"por isso",fr:"c'est pourquoi"}}; if(d[texto]&&d[texto][lang]) return d[texto][lang]; return texto; }
let BANCO=[{q:"Sinónimo de ACLARAR",ops:["Confundir","Explicar","Tapar","Esconder","Enredar"],c:1,tema:"sinonimo"},{q:"MÉDICO es a HOSPITAL como PROFESOR es a:",ops:["Colegio","Avión","Cocina","Calle","Parque"],c:0,tema:"analogia"},{q:"Si 2 lapiceros cuestan S/6, ¿5 cuánto?",ops:["S/15","S/10","S/12","S/18","S/20"],c:0,tema:"regla",g:"✏️✏️=S/6"},{q:"Serie: 2,4,8,16...",ops:["24","20","32","30","18"],c:2,tema:"series",g:"2→4→8→16→?"},{q:"Si a#b=a+b+1, calcula 3#4",ops:["8","7","9","10","6"],c:0,tema:"operadores",g:"a#b=a+b+1"},{q:"Completa: Estudié mucho, ___ aprobé",ops:["por eso","aunque","pero","ya que","sin embargo"],c:0,tema:"conectores"},{q:"Palabra que NO pertenece",ops:["Alegre","Contento","Feliz","Triste","Dichoso"],c:3,tema:"exclusion"},{q:"40 es el 20% de:",ops:["200","100","80","400","150"],c:0,tema:"porcentajes",g:"20%→40"},{q:"¿Cuántos triángulos?",ops:["4","5","3","6","2"],c:0,tema:"conteo",g:"△"},{q:"El doble de 15 más 5",ops:["35","30","25","40","20"],c:0,tema:"basico",g:"15x2+5"}];
function gen(){return BANCO.sort(()=>Math.random()-0.5).slice(0,10).map(p=>{let ops=p.ops.map((op,i)=>({op,i})).sort(()=>Math.random()-0.5);return{...p,ops:ops.map(x=>x.op),c:ops.findIndex(x=>x.i===p.c),id:Math.random().toString(36).slice(2,5),q0:p.q,ops0:[...p.ops]}})}
let reto10=gen();
async function cambiarIdioma(){LANG=document.getElementById('idioma').value;for(let p of reto10){p.q=await traducirIA(p.q0,LANG);for(let i=0;i<p.ops.length;i++)p.ops[i]=await traducirIA(p.ops0[i],LANG);}show()}
async function show(){if(fase==="reto"){if(idx>=10){let h=`<h2>${T[LANG].puntaje}</h2><h1 style="font-size:48px">${pts}/10</h1>`;h+=falladas.length?`<button onclick="iniciar()" style="text-align:center;background:#22c55e;color:white">${T[LANG].ia} (${falladas.length*2})</button>`:`<button onclick="location.reload()" style="text-align:center;background:#0f172a;color:white">Nuevo</button>`;document.getElementById('box').innerHTML=h;return}let p=reto10[idx];let html=`<div style="font-size:11px">${T[LANG].preg} ${idx+1}/10 ID:${p.id} ${T[LANG].trad}</div><h3>${p.q}</h3>`;if(p.g)html+=`<div style="background:#f1f5f9;padding:10px;border-radius:10px">${p.g}</div>`;p.ops.forEach((op,i)=>html+=`<button onclick="responder(${i})">${String.fromCharCode(65+i)}) ${op}</button>`);document.getElementById('box').innerHTML=html;document.getElementById('fill').style.width=((idx+1)*10)+"%" }else{if(cola.length===0){document.getElementById('box').innerHTML=`<h2>🎉 ${pts}/10</h2><button onclick="location.reload()" style="text-align:center;background:#0f172a;color:white">Nuevo reto</button>`;return}let p=cola[0];let html=`<div>🤖 ${p.tema}</div><h3>${p.q}</h3>`;p.ops.forEach((op,i)=>html+=`<button onclick="responder(${i})">${String.fromCharCode(65+i)}) ${op}</button>`);document.getElementById('box').innerHTML=html}}
function responder(s){let p=fase==="reto"?reto10[idx]:cola[0];let ok=s===p.c;document.querySelectorAll('#box button').forEach((b,i)=>{if(i===p.c)b.classList.add('correct');else if(i===s)b.classList.add('wrong');b.disabled=true});if(fase==="reto"){if(!ok)falladas.push(p);else pts++;setTimeout(()=>{idx++;show()},700)}else{document.getElementById('box').innerHTML+=`<div style="background:#fef3c7;padding:8px;border-radius:8px;margin-top:8px"><b>IA:</b> ${ok?'✅':'❌ Era '+String.fromCharCode(65+p.c)}</div><button onclick="sig(${ok})" style="text-align:center;background:#0f172a;color:white;margin-top:8px">${T[LANG].cont} →</button>`}}
function sig(ok){if(ok)cola.shift();else{let n={q:`Nuevo ${cola[0].tema}`,q0:`Nuevo ${cola[0].tema}`,ops:["10","20","30","40","50"].sort(()=>Math.random()-0.5),ops0:["10","20","30","40","50"],c:0,tema:cola[0].tema,id:Math.random().toString(36).slice(2,5)};cola.push(n);cola.shift();cola.unshift(n)}show()}
function iniciar(){fase="practica";falladas.forEach(f=>{cola.push(f);cola.push({q:`Nuevo ${f.tema} (IA)`,q0:`Nuevo ${f.tema}`,ops:["10","20","30","40","50"].sort(()=>Math.random()-0.5),ops0:["10","20","30","40","50"],c:0,tema:f.tema,id:"ia"})});show()}
show();
</script></body></html>
