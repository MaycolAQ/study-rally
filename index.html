<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Rally</title><style>body{background:#0f172a;color:white;font-family:system-ui;text-align:center;margin:0;padding:10px}#box{background:white;color:#0f172a;border-radius:18px;padding:22px;max-width:600px;margin:15px auto;min-height:300px}button{padding:13px;margin:6px;border-radius:12px;border:1px solid #e2e8f0;background:white;width:100%;text-align:left}button.ok{background:#22c55e!important;color:white}button.bad{background:#ef4444!important;color:white}.bar{height:8px;background:#1e293b;border-radius:10px;max-width:600px;margin:10px auto}#fill{height:8px;background:#22c55e;width:0%}</style>
<script src="translation.js"></script><script src="problem_bank.js"></script><script src="adaptive_ai.js"></script><script src="ranking.js"></script></head>
<body><h2>🏁 Study Rally</h2><div class="bar"><div id="fill"></div></div><div id="box">Cargando 10 preguntas...</div>
<script>
let idx=0,pts=0,falladas=[],LANG="es",start=Date.now();
async function init(){
 let bank = ProblemBank.local || ProblemBank.bank;
 let reto = [...bank].sort(()=>0.5-Math.random()).slice(0,10);
 while(reto.length<10) reto.push({...bank[reto.length%bank.length]});
 reto.forEach(p=>{p.q=p.q0||p.q; p.ops=p.ops0||p.ops; p.c=p.c0??p.c;});
 window.reto10=reto; show();
}
function show(){
 let box=document.getElementById('box');
 if(idx>=10){
   let t=Math.floor((Date.now()-start)/1000);
   let n=prompt(`Fin: ${pts}/10 en ${t}s - Tu nombre:`)||"Anonimo";
   Ranking.save(n,pts,t,"es");
   box.innerHTML=Ranking.getHTML(); return;
 }
 let p=reto10[idx];
 box.innerHTML=`<small>${idx+1}/10 - ${p.tema||''}</small><h3>${p.q}</h3>`+p.ops.map((o,i)=>`<button onclick="go(${i})">${String.fromCharCode(65+i)}) ${o}</button>`).join('');
 document.getElementById('fill').style.width=((idx+1)*10)+"%";
}
function go(s){
 let p=reto10[idx]; let ok=s===p.c;
 document.querySelectorAll('button').forEach((b,i)=>{if(i===p.c)b.classList.add('ok');else if(i===s)b.classList.add('bad');});
 if(!ok) falladas.push(p); else pts++;
 setTimeout(()=>{idx++;show();},600);
}
init();
</script></body></html>
