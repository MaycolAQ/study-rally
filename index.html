<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Rally - Aprende Jugando | Arequipa</title>
  <meta name="description" content="Juego educativo hecho en Cayma, Arequipa. Aprende jugando en Español, English, Português y Quechua. ¡Gratis para todo el mundo!">

  <meta property="og:title" content="Study Rally - Aprende Jugando">
  <meta property="og:description" content="Juego educativo creado en Arequipa, Perú. ¡Ahora en 4 idiomas!">
  <meta property="og:image" content="https://maycolaq.github.io/study-rally/preview.png">
  <meta property="og:url" content="https://maycolaq.github.io/study-rally/">
  <meta property="og:type" content="website">

  <link rel="alternate" hreflang="es" href="https://maycolaq.github.io/study-rally/?lang=es">
  <link rel="alternate" hreflang="en" href="https://maycolaq.github.io/study-rally/?lang=en">
  <link rel="alternate" hreflang="pt" href="https://maycolaq.github.io/study-rally/?lang=pt">
  <link rel="alternate" hreflang="qu" href="https://maycolaq.github.io/study-rally/?lang=qu">

  <style>
    body{font-family:Arial;text-align:center;background:#f0f8ff;padding:20px}
    #game{max-width:600px;margin:auto;background:white;padding:20px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
    button{padding:10px 18px;margin:5px;border-radius:10px;border:none;background:#007bff;color:white;cursor:pointer;font-size:16px}
    button:hover{background:#0056b3}
   .lang-bar{text-align:right;margin-bottom:10px}
  </style>
</head>
<body>
<div id="game">
  <div class="lang-bar">
    <button onclick="setLang('es')">🇵🇪 ES</button>
    <button onclick="setLang('en')">🇺🇸 EN</button>
    <button onclick="setLang('pt')">🇧🇷 PT</button>
    <button onclick="setLang('qu')">🏔️ QU</button>
  </div>

  <h1 data-t="title">STUDY RALLY 🌎</h1>
  <p id="stats"><span data-t="level">Nivel</span> <span id="lvl">1</span> | <span data-t="xp">XP</span> <span id="xp">0</span> | ❤️<span id="lives">3</span></p>

  <div id="menu">
    <button onclick="startGame('verbal')" data-t="verbal">📚 Verbal</button>
    <button onclick="startGame('math')" id="mathBtn" data-t="math">🔢 Matemático 🔒</button>
  </div>
  <div id="questionBox"></div>
</div>

<script>
const translations = {
  es: { title: "STUDY RALLY 🌎", level: "Nivel", xp: "XP", verbal: "📚 Verbal", math: "🔢 Matemático", next: "Siguiente", correct: "¡Correcto!" },
  en: { title: "STUDY RALLY 🌎", level: "Lvl", xp: "XP", verbal: "📚 Verbal", math: "🔢 Math", next: "Next", correct: "Correct!" },
  pt: { title: "STUDY RALLY 🌎", level: "Nível", xp: "XP", verbal: "📚 Verbal", math: "🔢 Matemática", next: "Próximo", correct: "Correto!" },
  qu: { title: "STUDY RALLY 🌎", level: "Pataku", xp: "XP", verbal: "📚 Simi", math: "🔢 Yupay", next: "Qatiq", correct: "Allin!" }
};
function setLang(lang){
  localStorage.setItem('lang', lang);
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key = el.dataset.t;
    if(translations[lang] && translations[lang][key]) el.innerText = translations[lang][key];
  });
  document.documentElement.lang = lang;
}
setLang(localStorage.getItem('lang') || 'es');
</script>

<script src="script.js"></script>
</body>
</html>
